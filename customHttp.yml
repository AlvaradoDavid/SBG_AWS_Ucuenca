# Cabeceras HTTP que Amplify añade a cada respuesta. Ver D-25 en docs/decisiones.md.
#
# Va aquí y no en amplify.yml: AWS pide sacarlas de la especificación de build.
# Este archivo tiene prioridad sobre lo que se defina en la consola
# (Hosting → Custom headers), así que la consola se deja vacía.
# Se aplica en el siguiente build: basta con hacer push.

customHeaders:
  # Todo lo que está en /_astro/ lleva un hash en el nombre: si el contenido
  # cambia, cambia la URL. Por eso el navegador puede guardarlo un año sin
  # volver a preguntar. El HTML, las fuentes y Pagefind no llevan hash y se
  # quedan con la caché por defecto de Amplify (el navegador revalida siempre).
  - pattern: '/_astro/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  # Los archivos de calendario de los próximos eventos (/student-community-day.ics).
  # Con este tipo, el iPhone ofrece agregarlos al Calendario en vez de descargarlos.
  - pattern: '/*.ics'
    headers:
      - key: 'Content-Type'
        value: 'text/calendar; charset=utf-8'

  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      # El sitio no carga nada de otros orígenes: fuentes, fotos, estilos y
      # scripts salen del propio dominio. 'unsafe-inline' hace falta porque
      # Astro incrusta sus scripts y estilos en el HTML.
      # Si algún día se añade un recurso externo (un video, un formulario,
      # analítica), hay que declararlo aquí o el navegador lo bloqueará en
      # silencio. Lo mismo con el buscador de Pagefind: su motor es WebAssembly
      # y necesita 'wasm-unsafe-eval' en script-src.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
